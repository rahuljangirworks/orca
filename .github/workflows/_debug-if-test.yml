name: Debug If Test
on:
  workflow_dispatch: {}

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

  build-mac:
    needs: cut
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

  golden-mock:
    needs: cut
    if: github.repository == 'stablyai/orca'
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

  publish-mock-singleline:
    needs:
      - cut
      - build-mac
      - golden-mock
    if: needs.cut.result == 'success' && needs['build-mac'].result == 'success' && (needs['golden-mock'].result == 'success' || needs['golden-mock'].result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - run: echo "PUBLISH RAN (singleline)"

  publish-mock-multiline:
    needs:
      - cut
      - build-mac
      - golden-mock
    if: |
      needs.cut.result == 'success' &&
      needs['build-mac'].result == 'success' &&
      (needs['golden-mock'].result == 'success' || needs['golden-mock'].result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - run: echo "PUBLISH RAN (multiline)"

  publish-mock-alwaysgate:
    needs:
      - cut
      - build-mac
      - golden-mock
    if: >-
      always() &&
      needs.cut.result == 'success' &&
      needs['build-mac'].result == 'success' &&
      (needs['golden-mock'].result == 'success' || needs['golden-mock'].result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - run: echo "PUBLISH RAN (alwaysgate)"
