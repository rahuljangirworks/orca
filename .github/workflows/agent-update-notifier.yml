name: Agent - Update Notifier

# Notifies users when new Veer releases are published
# Posts to multiple channels and updates backend

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to notify about'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get release info
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Fetch release details
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,body,url,isPrerelease,isDraft > release.json

          NAME=$(jq -r '.name' release.json)
          URL=$(jq -r '.url' release.json)
          IS_PRERELEASE=$(jq -r '.isPrerelease' release.json)
          IS_DRAFT=$(jq -r '.isDraft' release.json)

          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "is_draft=$IS_DRAFT" >> $GITHUB_OUTPUT

          # Extract version
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Determine release type
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "type=Pre-release" >> $GITHUB_OUTPUT
            echo "emoji=🧪" >> $GITHUB_OUTPUT
          else
            echo "type=Stable Release" >> $GITHUB_OUTPUT
            echo "emoji=🚀" >> $GITHUB_OUTPUT
          fi

      - name: Get download links
        id: downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # Get asset download URLs
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > assets.json

          LINUX_APPIMAGE=$(jq -r '.assets[] | select(.name | test(".*AppImage.*x64")) | .url' assets.json | head -1)
          LINUX_DEB=$(jq -r '.assets[] | select(.name | endswith(".deb")) | .url' assets.json | head -1)
          WINDOWS_EXE=$(jq -r '.assets[] | select(.name | contains("windows-setup")) | .url' assets.json | head -1)
          MAC_DMG=$(jq -r '.assets[] | select(.name | contains("mac") and endswith(".dmg")) | .url' assets.json | head -1)

          echo "linux_appimage=$LINUX_APPIMAGE" >> $GITHUB_OUTPUT
          echo "linux_deb=$LINUX_DEB" >> $GITHUB_OUTPUT
          echo "windows_exe=$WINDOWS_EXE" >> $GITHUB_OUTPUT
          echo "mac_dmg=$MAC_DMG" >> $GITHUB_OUTPUT

      - name: Generate notification message
        id: message
        run: |
          MESSAGE="${{ steps.release.outputs.emoji }} **Veer ${{ steps.release.outputs.version }}** is now available!\n\n"
          MESSAGE="${MESSAGE}**Type:** ${{ steps.release.outputs.type }}\n"
          MESSAGE="${MESSAGE}**Release Notes:** ${{ steps.release.outputs.url }}\n\n"
          MESSAGE="${MESSAGE}### Download\n\n"

          if [ -n "${{ steps.downloads.outputs.linux_appimage }}" ]; then
            MESSAGE="${MESSAGE}🐧 **Linux:** [AppImage](${{ steps.downloads.outputs.linux_appimage }}) | [deb](${{ steps.downloads.outputs.linux_deb }})\n"
          fi

          if [ -n "${{ steps.downloads.outputs.windows_exe }}" ]; then
            MESSAGE="${MESSAGE}🪟 **Windows:** [Installer](${{ steps.downloads.outputs.windows_exe }})\n"
          fi

          if [ -n "${{ steps.downloads.outputs.mac_dmg }}" ]; then
            MESSAGE="${MESSAGE}🍎 **macOS:** [DMG](${{ steps.downloads.outputs.mac_dmg }})\n"
          fi

          MESSAGE="${MESSAGE}\n---\n"
          MESSAGE="${MESSAGE}_Auto-generated by Update Notifier agent_"

          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo -e "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Also generate plain text version for non-Markdown channels
          PLAIN="Veer ${{ steps.release.outputs.version }} is now available!\n"
          PLAIN="${PLAIN}Download: ${{ steps.release.outputs.url }}"

          echo "plain<<EOF" >> $GITHUB_OUTPUT
          echo -e "$PLAIN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create announcement issue
        if: vars.VEER_AUTOMATION_ISSUES_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: ${{ steps.message.outputs.message }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "📢 Veer $VERSION Released" \
            --label "announcement,release" \
            --body "$MESSAGE"

      - name: Post to GitHub Discussions (if enabled)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: ${{ steps.message.outputs.message }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Note: Requires GitHub Discussions to be enabled
          # This will fail gracefully if discussions aren't enabled
          gh api graphql -f query='
            mutation($repositoryId: ID!, $categoryId: ID!, $title: String!, $body: String!) {
              createDiscussion(input: {
                repositoryId: $repositoryId,
                categoryId: $categoryId,
                title: $title,
                body: $body
              }) {
                discussion {
                  id
                }
              }
            }
          ' -f repositoryId="${{ github.repository_id }}" \
            -f categoryId="$DISCUSSION_CATEGORY_ID" \
            -f title="Veer $VERSION Released" \
            -f body="$MESSAGE" || echo "Discussions not enabled, skipping"

      - name: Send to Discord webhook
        if: vars.DISCORD_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ vars.DISCORD_WEBHOOK_URL }}
          MESSAGE: ${{ steps.message.outputs.message }}
          VERSION: ${{ steps.release.outputs.version }}
          URL: ${{ steps.release.outputs.url }}
        run: |
          # Send Discord webhook notification
          curl -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"username\": \"Veer Release Bot\",
              \"avatar_url\": \"https://github.com/rahuljangirworks.png\",
              \"embeds\": [{
                \"title\": \"${{ steps.release.outputs.emoji }} Veer $VERSION Released\",
                \"description\": \"$MESSAGE\",
                \"url\": \"$URL\",
                \"color\": 5814783,
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }"

      - name: Send to Telegram
        if: vars.TELEGRAM_BOT_TOKEN != '' && vars.TELEGRAM_CHAT_ID != ''
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          MESSAGE: ${{ steps.message.outputs.plain }}
        run: |
          curl -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "text=$MESSAGE" \
            -d "parse_mode=Markdown"

      - name: Update backend API
        continue-on-error: true
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Note: This requires a backend endpoint that accepts version updates
          # For now, just verify the backend is accessible
          curl -f "https://veer-api.rahuljangir-works.workers.dev/config.json" || echo "Backend update skipped"

      - name: Generate shareable social posts
        id: social
        run: |
          # Twitter/X format (280 chars)
          TWITTER="🚀 Veer ${{ steps.release.outputs.version }} is out!\n\n"
          TWITTER="${TWITTER}Your AI coding warrior, now even better.\n\n"
          TWITTER="${TWITTER}Download: ${{ steps.release.outputs.url }}\n\n"
          TWITTER="${TWITTER}#Veer #AI #Coding #OpenSource"

          # LinkedIn format
          LINKEDIN="I'm excited to announce Veer ${{ steps.release.outputs.version }}!\n\n"
          LINKEDIN="${LINKEDIN}Veer (वीर - Brave Warrior) is an AI-powered development assistant"
          LINKEDIN="${LINKEDIN} built for productivity and speed.\n\n"
          LINKEDIN="${LINKEDIN}Download now: ${{ steps.release.outputs.url }}\n\n"
          LINKEDIN="${LINKEDIN}#OpenSource #AI #DeveloperTools"

          echo "twitter<<EOF" >> $GITHUB_OUTPUT
          echo -e "$TWITTER" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "linkedin<<EOF" >> $GITHUB_OUTPUT
          echo -e "$LINKEDIN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Save to job summary
          echo "## Shareable Social Posts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Twitter/X" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo -e "$TWITTER" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### LinkedIn" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo -e "$LINKEDIN" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Summary
        run: |
          echo "✅ Notifications sent for Veer ${{ steps.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Channels" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ GitHub Issue created" >> $GITHUB_STEP_SUMMARY

          if [ -n "${{ vars.DISCORD_WEBHOOK_URL }}" ]; then
            echo "- ✅ Discord notified" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ Discord (webhook not configured)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "${{ vars.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "- ✅ Telegram notified" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ Telegram (bot not configured)" >> $GITHUB_STEP_SUMMARY
          fi
